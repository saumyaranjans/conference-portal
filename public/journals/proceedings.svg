<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="GLOGIFT 27 Conference Proceedings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3f8f"/>
      <stop offset="55%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="400" height="520" fill="url(#bg)"/>

  <circle cx="330" cy="70" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="360" cy="150" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <text x="28" y="46" fill="#ffffff" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.6">ISBN · CONFERENCE PROCEEDINGS</text>

  <rect x="0" y="66" width="332" height="176" fill="#0a3a86" fill-opacity="0.55"/>
  <text x="28" y="130" font-family="Georgia, serif" font-size="40" font-weight="bold"><tspan fill="#ffd54f">GLOGIFT</tspan><tspan fill="#ffffff" dx="14">27</tspan></text>
  <text x="28" y="186" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19">Conference</text>
  <text x="28" y="212" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19">Proceedings</text>

  <g transform="translate(150,300)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#mark)"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.3">
      <circle cx="40" cy="42" r="17" opacity="0.95"/>
      <circle cx="60" cy="42" r="17" opacity="0.85"/>
      <circle cx="50" cy="60" r="17" opacity="0.7"/>
    </g>
  </g>

  <text x="200" y="440" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-family="Segoe UI, Arial, sans-serif" font-size="14">International Conference on AI-Driven</text>
  <text x="200" y="460" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-family="Segoe UI, Arial, sans-serif" font-size="14">Solutions in Management</text>

  <rect x="0" y="484" width="400" height="36" fill="#062b63" fill-opacity="0.75"/>
  <text x="200" y="507" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="Segoe UI, Arial, sans-serif" font-size="12">Global Institute of Flexible Systems Management</text>
